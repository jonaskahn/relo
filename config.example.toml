# Relo startup configuration. Copy to $RELO_HOME/config.toml (default ~/.relo/config.toml).
# Every field below is optional and shows its default value.

# ── Start & maintain: when Relo runs, how it logs, how it updates ──────────
[system]
  autostart = true    # start Relo at login: the daemon and its tray icon
  headless = false    # true assumes no browser can open: provider logins print their URL instead

  [system.logging]
    level = "info"    # debug | info | warn | error
    traffic = false   # true also writes every agent and provider exchange, in full, to logs/traffic-YYYYMMDD.log

  [system.updates]
    url = "https://jonaskahn.github.io/relo/appcast.xml"          # empty turns the version check off
    download = "https://github.com/jonaskahn/relo/releases/latest"  # Windows, Linux, and daemon-only installs open this page

# ── Serve: how clients reach Relo ───────────────────────────────────────────
[server]
  bind = "127.0.0.1"  # loopback by default; expose it deliberately
  port = 10101        # the console, the management API, the login callbacks,
                      # and the data plane: /inference/v1/* speaks OpenAI,
                      # /inference-claude/v1/* speaks Anthropic

# ── Reach out: how Relo gets to providers and their directories ────────────
[proxy]
  url = ""            # the outbound HTTP(S) proxy for opted-in connections; empty goes direct

# How long one provider call may stay silent before it is cancelled and
# retried, how many times a failing account is retried before the request
# moves to the next account (a random 1–3s wait between those retries), and
# the first step of the wait ladder a connection or route walks when every
# account or member failed. Timeout presets: 180, 300, 600, 900, 1800.
# Retry presets: 1, 3, 5. Failover presets: 0, 180, 300, 900, 1800, 3600,
# 18000, where the chosen preset is the first step and each further failure
# without a success between moves to the next. Zero starts with no wait:
# the first refusal is immediately reusable.
[upstream]
  timeout_seconds = 300
  retry_attempts = 3
  failover_cooldown_seconds = 0

[catalog]
  modelsdev_url = "https://models.dev/api.json"  # the model directory the catalog reads

# ── Security: the vault and who may open the console ───────────────────────
[secrets]
  keychain = false         # set to true to store provider credentials in the OS keychain
  key_file = "secret.key"  # the vault key: relative to RELO_HOME, or an absolute path.
                           # Relo writes it with a random key the first time it starts.
                           # Back it up with secrets.enc: neither opens without the other.

[admin]
  login = false            # false leaves the console open to this machine, which is where it
                           # listens. Set it to true to ask for the admin token first, and to
                           # serve the console from anywhere other than a loopback address.
  allow_external = false   # true lets the console be reached through a forwarded address while
                           # login is off; everything outside this machine then needs the token

# ── Look & language ─────────────────────────────────────────────────────────
[ui]
  language = "auto"   # auto or a shipped tag (en, de, zh-Hans, zh-Hant, fr, es, it, pt-BR, nl, sv, pl, cs, ro, ru, uk, ja, ko, hi, id, ar, vi, th, tr); the --lang flag overrides it for one run
  theme = "system"    # system, light, or dark; the console adopts changes at once
  accent = "#c8102e"  # a #rrggbb colour the radar picked, or a preset id from the board:
                      # terracotta, persimmon, cherry-cola, clay-rose, saffron, mocha, moss, sage,
                      # pine, matcha, lagoon, ocean, cobalt, dusk-blue, midnight, lavender-haze,
                      # orchid, plum, graphite

  # The cards the usage overview shows, in order. Pick between 6 and 10 of:
  # requests, successes, errors, success_rate, error_rate, attempts, retried,
  # tokens_input, tokens_output, tokens_total, tokens_per_request, cache_read,
  # cache_write, spend, plan_usage, spend_per_request,
  # priced_requests, unpriced_requests, duration_avg, duration_max.
  # The console edits this list.
  [ui.usage]
    overview_metrics = ["requests", "tokens_total", "spend", "plan_usage", "success_rate", "error_rate", "duration_avg", "retried", "cache_read"]

# ── Free connections: third-party pools used at your own risk ────────────────
[connections]
  free = false  # fresh installs require opt-in and consent in the add-connection modal
                # existing files without this key keep true for upgrade compatibility
