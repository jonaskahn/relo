          fill="url(#plate)"/>
    <g clip-path="url(#squircle)">
        <rect width="512" height="512" fill="url(#sheen)"/>
        <rect width="512" height="512" fill="url(#depth)"/>
    </g>
    <!-- The brand mark, scaled to 66% of the plate and centred. The numbers are
         logo-mark.svg with the scale and offset applied by hand, because the SVG
         rasteriser drops every element that carries a transform attribute. -->
    <g stroke="#ffffff" stroke-width="21.12" stroke-linecap="round" fill="none">
        <path d="M256.00 147.10 A108.90 108.90 0 0 1 364.90 256.00"/>
        <path d="M256.00 364.90 A108.90 108.90 0 0 1 147.10 256.00"/>
    </g>
    <circle cx="256" cy="256" r="42.24" fill="#ffffff"/>
</svg>
