name: Beta

# Every green merge to main becomes a beta: daemon binaries built on macOS,
# published under a prerelease tag, on npm's `beta` dist-tag, and in the tap
# as its own formula. Every platform ships as a versioned tarball, with the
# checksums beside it; no raw binaries and no desktop installer. Nothing here
# writes a stable channel: no release.yml job, no Formula/relo.rb, no npm
# `latest`, and no appcast entry, so an installed Relo never sees a beta.
# No macOS app or Linux packages.
#
# The version is derived, never committed, so the README badge and the declared
# versions stay on the release the repository is working towards. It descends
# from that release with the CI run number for ordering and the commit for
# traceability: 0.1.0-beta.417.4f3a9c21.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Not cancellable: every merge was promised a beta, and a newer run does not
# make an older one unnecessary.
concurrency:
  group: beta-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    # Only successful CI for a push to main may publish a beta.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.beta.outputs.sha }}
      version: ${{ steps.beta.outputs.version }}
      build: ${{ steps.beta.outputs.build }}
      tag: ${{ steps.beta.outputs.tag }}
    steps:
      - name: Checkout the merge
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Name the beta
        id: beta
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.run_number }}
        run: |
          base=$(./scripts/version.py current)
          base="${base%%-*}"
          hash="${SHA:0:8}"
          # 0.1.0 -> 0.1.417: three integers that rise, for the bundle's build
          # number. A patch line keeps rising until the next release moves it.
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$base-beta.$RUN.$hash" >> "$GITHUB_OUTPUT"
          echo "build=${base%.*}.$RUN" >> "$GITHUB_OUTPUT"
          echo "tag=v$base-beta.$RUN.$hash" >> "$GITHUB_OUTPUT"
          echo "beta $base-beta.$RUN.$hash ($hash)"

  binaries:
    name: Build daemon binaries
    needs: gate
    # M-series runner: Go cross-compiles every platform with CGO off, so one
    # macOS host builds all binaries and no other OS runner is needed.
    runs-on: macos-15
    outputs:
      arm64: ${{ steps.sha.outputs.arm64 }}
      amd64: ${{ steps.sha.outputs.amd64 }}
      linux_arm64: ${{ steps.sha.outputs.linux_arm64 }}
      linux_amd64: ${{ steps.sha.outputs.linux_amd64 }}
    steps:
      - name: Checkout the merge
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Assert an Apple silicon runner
        run: |
          # macos-15 is the arm64 image (macos-15-intel is the x86_64 one), but
          # the label is a convention, not a guarantee. Every darwin, linux, and
          # windows binary below is cross-compiled from this one host, so an
          # Intel runner has to fail here rather than quietly become the base.
          arch=$(uname -m)
          [ "$arch" = arm64 ] || { echo "runner is $arch, want arm64" >&2; exit 1; }
          echo "building every platform from an $arch host"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build all platforms
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          make build-all VERSION="$VERSION"
          ver="$VERSION"
          ver="${ver#v}"
          for os in darwin linux windows; do
            for arch in arm64 amd64; do
              ext=""
              if [ "$os" = "windows" ]; then ext=".exe"; fi
              tmp="$(mktemp -d)"
              cp "dist/relo-$os-$arch$ext" "$tmp/relo$ext"
              tar -czf "dist/relo-$ver-$os-$arch.tar.gz" -C "$tmp" "relo$ext"
              rm -rf "$tmp"
            done
          done
          # shasum, not sha256sum: the latter does not exist on macOS. The
          # output format is the same, so the sha parsing below still holds.
          cd dist && shasum -a 256 relo-*.tar.gz > checksums.txt && cat checksums.txt

      - name: Read the tarball shas
        id: sha
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ver="${VERSION#v}"
          echo "arm64=$(grep "relo-$ver-darwin-arm64.tar.gz" dist/checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "amd64=$(grep "relo-$ver-darwin-amd64.tar.gz" dist/checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(grep "relo-$ver-linux-arm64.tar.gz" dist/checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(grep "relo-$ver-linux-amd64.tar.gz" dist/checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 30

  release:
    name: Publish the prerelease
    needs: [gate, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the merge
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create the GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          ls release/
          # --prerelease, not --draft: the tarball and zip URLs have to resolve
          # before the tap formula and the npm package point at them. A
          # prerelease is also what keeps /releases/latest on the stable one.
          #
          # A re-run finds the prerelease this one already created, so the
          # assets are replaced instead: the tag is the same build either way,
          # and refusing to re-upload would leave a failed retry stuck at the
          # release step forever.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "$TAG_NAME already exists; replacing its assets"
            gh release upload "$TAG_NAME" release/* --clobber
          else
            gh release create "$TAG_NAME" release/* \
              --title "$TAG_NAME" \
              --generate-notes \
              --prerelease \
              --target "$SHA"
          fi

  catalog:
    name: Publish the release catalog
    needs: [release]
    # A release made with GITHUB_TOKEN does not trigger the release event that
    # usually refreshes gh-pages/releases.json, so the beta lane calls the same
    # workflow directly. The catalog's latest_beta is what a beta build reads.
    uses: ./.github/workflows/publish-releases.yml
    permissions:
      contents: write

  npm:
    name: Publish npm beta
    needs: [gate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance signs the tarball through the OIDC token.
      id-token: write
    steps:
      - name: Checkout the merge
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Installer tests
        run: make test-npm

      - name: Name the package
        id: named
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          cd packaging/npm
          # Never let a stable version out through this workflow: only a
          # prerelease may publish, and it always goes under the beta tag,
          # so npm's `latest` is never moved.
          case "$VERSION" in
            *-beta.*) ;;
            *) echo "refusing to publish non-beta version $VERSION" >&2; exit 1 ;;
          esac
          # An already published version is the end state this job wants, so a
          # re-run says so instead of failing on npm's immutable versions.
          if npm view "@jonaskahn/relo@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already on the registry"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version
          grep '"version"' package.json
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.named.outputs.published != 'true'
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag beta --provenance

  tap:
    name: Publish the Homebrew beta formula
    needs: [gate, binaries, release]
    # Pinned to the beta formula: the stable Formula/relo.rb is never
    # written from this workflow, so brew's latest stays on releases.
    uses: ./.github/workflows/release-brew.yml
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    with:
      tag: ${{ needs.gate.outputs.tag }}
      version: ${{ needs.gate.outputs.version }}
      arm64_sha: ${{ needs.binaries.outputs.arm64 }}
      amd64_sha: ${{ needs.binaries.outputs.amd64 }}
      linux_arm64_sha: ${{ needs.binaries.outputs.linux_arm64 }}
      linux_amd64_sha: ${{ needs.binaries.outputs.linux_amd64 }}
      formula_path: Formula/relo-beta.rb
      class_name: ReloBeta
