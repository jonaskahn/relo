name: Release Homebrew Tap

# Fires only once a release is public (draft -> published), so the tarball
# URLs below always resolve for end users. Same trigger as publish-appcast.yml.
#
# Also callable (workflow_call) so a beta publishes its own formula from this
# same template: Formula/relo.rb carries the stable channel, Formula/relo-beta.rb
# the beta one, and neither run ever writes the other's file.
on:
  release:
    types:
      - published
  workflow_call:
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: Token that pushes the formula to the tap repository
        required: true
    inputs:
      tag:
        description: Release tag the formula downloads from, e.g. v0.1.0-beta.12.abcdef12
        required: true
        type: string
      version:
        description: Version the formula reports, without a leading v
        required: true
        type: string
      arm64_sha:
        description: sha256 of the macOS arm64 tarball
        required: true
        type: string
      amd64_sha:
        description: sha256 of the macOS amd64 tarball
        required: true
        type: string
      linux_arm64_sha:
        description: sha256 of the Linux arm64 tarball
        required: true
        type: string
      linux_amd64_sha:
        description: sha256 of the Linux amd64 tarball
        required: true
        type: string
      formula_path:
        description: Formula file to write, relative to the tap root
        required: true
        type: string
      class_name:
        description: Ruby class name the formula declares
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump-tap:
    # A caller passes inputs and is trusted; on the release event the guard is
    # what keeps a beta prerelease from overwriting the stable formula.
    if: ${{ inputs.tag || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Read the version and tarball shas
        id: sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARM64: ${{ inputs.arm64_sha }}
          INPUT_AMD64: ${{ inputs.amd64_sha }}
          INPUT_LINUX_ARM64: ${{ inputs.linux_arm64_sha }}
          INPUT_LINUX_AMD64: ${{ inputs.linux_amd64_sha }}
        run: |
          # A caller already holds the tag, the version, and every shas; only
          # the release path reads them back out of the published checksums.
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "arm64=$INPUT_ARM64" >> "$GITHUB_OUTPUT"
            echo "amd64=$INPUT_AMD64" >> "$GITHUB_OUTPUT"
            echo "linux_arm64=$INPUT_LINUX_ARM64" >> "$GITHUB_OUTPUT"
            echo "linux_amd64=$INPUT_LINUX_AMD64" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf /tmp/brew && mkdir -p /tmp/brew
          gh release download "$RELEASE_TAG" --pattern "checksums.txt" --dir /tmp/brew
          cat /tmp/brew/checksums.txt
          ver="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "arm64=$(grep "relo-$ver-darwin-arm64.tar.gz" /tmp/brew/checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "amd64=$(grep "relo-$ver-darwin-amd64.tar.gz" /tmp/brew/checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(grep "relo-$ver-linux-arm64.tar.gz" /tmp/brew/checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(grep "relo-$ver-linux-amd64.tar.gz" /tmp/brew/checksums.txt | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: jonaskahn/homebrew-apps
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        env:
          TAG_NAME: ${{ steps.sha.outputs.tag }}
          VERSION: ${{ steps.sha.outputs.version }}
          ARM64_SHA: ${{ steps.sha.outputs.arm64 }}
          AMD64_SHA: ${{ steps.sha.outputs.amd64 }}
          LINUX_ARM64_SHA: ${{ steps.sha.outputs.linux_arm64 }}
          LINUX_AMD64_SHA: ${{ steps.sha.outputs.linux_amd64 }}
          FORMULA_PATH: ${{ inputs.formula_path || 'Formula/relo.rb' }}
          CLASS_NAME: ${{ inputs.class_name || 'Relo' }}
        run: |
          [ -n "$ARM64_SHA" ] && [ -n "$AMD64_SHA" ] && [ -n "$LINUX_ARM64_SHA" ] && [ -n "$LINUX_AMD64_SHA" ] || { echo "missing tarball sha" >&2; exit 1; }
          mkdir -p "tap/$(dirname "$FORMULA_PATH")"
          cat > "tap/$FORMULA_PATH" <<EOF
          class ${CLASS_NAME} < Formula
            desc "Local proxy letting coding agents talk to any model"
            homepage "https://github.com/jonaskahn/relo"
            license "AGPL-3.0-only"

            on_macos do
              on_arm do
                url "https://github.com/jonaskahn/relo/releases/download/$TAG_NAME/relo-$VERSION-darwin-arm64.tar.gz"
                sha256 "$ARM64_SHA"
              end
              on_intel do
                url "https://github.com/jonaskahn/relo/releases/download/$TAG_NAME/relo-$VERSION-darwin-amd64.tar.gz"
                sha256 "$AMD64_SHA"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/jonaskahn/relo/releases/download/$TAG_NAME/relo-$VERSION-linux-arm64.tar.gz"
                sha256 "$LINUX_ARM64_SHA"
              end
              on_intel do
                url "https://github.com/jonaskahn/relo/releases/download/$TAG_NAME/relo-$VERSION-linux-amd64.tar.gz"
                sha256 "$LINUX_AMD64_SHA"
              end
            end

            def install
              check_single_install!
              quiesce_daemon!
              bin.install "relo"
            end

            def caveats
              <<~EOS
                Relo keeps data in ~/.relo. Stop the daemon before removing Relo so
                the ports it serves are freed:
                  relo daemon stop --force
                \`brew uninstall relo\` keeps your data, like apt and npm do. To remove
                the program and the data: \`relo uninstall --wipe\`, then
                \`brew uninstall relo\`. Do not use \`brew services\`; autostart is
                \`relo autostart enable|disable\`.
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/relo version")
            end

            # Single-method rule: at most one Relo provides the relo command. A
            # Relo.app bundle, a Linux package, an npm global, or a manual copy
            # keeps updating through its own method, or is removed completely
            # first. Two installs would fight over the name, the home directory,
            # and the ports. This formula's own link, including the previous keg
            # during an upgrade, is never a conflict.
            def check_single_install!
              # Both sides are resolved before they are compared: macOS reaches
              # the same directory through /var and /private/var, so a raw
              # prefix compare would call the previous keg a stranger.
              cellar = realpath_of(HOMEBREW_CELLAR.to_s) + File::SEPARATOR
              own = realpath_of((HOMEBREW_PREFIX/"bin/relo").to_s)
              hits = []

              # Best effort: a node that cannot answer is not a reason to refuse.
              begin
                if (npm = which("npm"))
                  npm_bin = Utils.safe_popen_read(npm, "prefix", "-g").strip
                  shim = File.join(npm_bin, "bin", "relo")
                  hits << shim if !npm_bin.empty? && File.executable?(shim)
                end
              rescue
                nil
              end
              hits << "/Applications/Relo.app" if File.exist?("/Applications/Relo.app")

              (ENV["PATH"] || "").split(File::PATH_SEPARATOR).each do |dir|
                next if dir.empty?

                candidate = File.join(dir, "relo")
                next unless File.executable?(candidate)

                next if File.directory?(candidate)

                resolved = realpath_of(candidate)
                next if resolved.start_with?(cellar) || resolved == own

                hits << candidate
              end

              return if hits.uniq.empty?

              odie <<~EOS
                another Relo install already provides the relo command:
                #{hits.uniq.map { |h| "  #{h}" }.join("\n")}
                Keep updating through that install, or remove it completely first:
                  relo daemon stop --force && relo uninstall --keep-data
                then remove its program (delete Relo.app, npm uninstall -g @jonaskahn/relo,
                apt remove relo), and run brew install again.
              EOS
            end

            # Ends a daemon a previous Relo left running and frees the port its config.toml names, so an upgrade or reinstall
            # never hands the new binary a port the old one still holds. During an
            # upgrade the linked command is the previous keg, which is what
            # recognises the running daemon. Best effort: nothing to stop is fine.
            def quiesce_daemon!
              linked = (HOMEBREW_PREFIX/"bin/relo").to_s
              running = File.executable?(linked) ? linked : which("relo")
              return if running.nil? || running.to_s.empty?

              quiet_system running, "daemon", "stop", "--force"
            end

            # realpath_of resolves a path through every link, or returns it
            # unchanged when nothing is there to resolve.
            def realpath_of(path)
              File.realpath(path)
            rescue SystemCallError
              path
            end
          end
          EOF
          ruby -c "tap/$FORMULA_PATH"

      - name: Commit and push tap
        env:
          TAG_NAME: ${{ steps.sha.outputs.tag }}
          FORMULA_PATH: ${{ inputs.formula_path || 'Formula/relo.rb' }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_PATH"
          git commit -m "chore: bump $FORMULA_PATH to $TAG_NAME" || exit 0
          git push
