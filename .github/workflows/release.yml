name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  official:
    # A tag carrying a prerelease belongs to the beta lane, which publishes its
    # own artifacts under a prerelease and deliberately leaves the installers,
    # the tap, npm and the appcast alone. `v*` matches those tags too, so this
    # is what stops a beta tag from building a second, official release beside
    # it. An official tag states no prerelease and passes.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the release
        run: echo "building the official release ${{ github.ref_name }}"

  binaries:
    name: Build daemon binaries
    needs: official
    # Apple silicon, like the beta lane: Go cross-compiles every platform with
    # CGO off, so one macOS host builds every daemon binary this release ships.
    # The .deb and .rpm jobs still run on their own OS, where the packager
    # they need is native. The Windows installer builds on Linux instead:
    # makensis cross-compiles there, which sidesteps the Git Bash path
    # translation native makensis.exe chokes on.
    runs-on: macos-15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Check versions match tag
        run: ./scripts/version.py check ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package.json

      - name: Build all platforms
        run: |
          make build-all VERSION=${{ github.ref_name }}
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          for os in darwin linux windows; do
            for arch in arm64 amd64; do
              ext=""
              if [ "$os" = "windows" ]; then ext=".exe"; fi
              tmp="$(mktemp -d)"
              cp "dist/relo-$os-$arch$ext" "$tmp/relo$ext"
              tar -czf "dist/relo-$ver-$os-$arch.tar.gz" -C "$tmp" "relo$ext"
              rm -rf "$tmp"
            done
          done
          # shasum, not sha256sum: the latter does not exist on macOS. The
          # output format is the same, so the sha parsing in release-brew.yml
          # still holds. Tarballs only: the release carries no raw binaries,
          # so every consumer -- brew, npm, the script installers -- reads
          # the same versioned archives the beta lane already publishes.
          cd dist && shasum -a 256 relo-*.tar.gz > checksums.txt && cat checksums.txt

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: dist/
          retention-days: 30

  macos:
    name: Build macOS app
    needs: official
    runs-on: macos-15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Check versions match tag
        run: ./scripts/version.py check ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package.json

      - name: Import Developer ID certificate
        env:
          APPLE_SIGN_P12_BASE64: ${{ secrets.APPLE_SIGN_P12_BASE64 }}
          APPLE_SIGN_P12_PASSWORD: ${{ secrets.APPLE_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          printf '%s' "$APPLE_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k actions "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -n 1 | sed 's/.*) \([A-F0-9]*\) .*/\1/')
          [ -n "$identity" ] || { echo "no Developer ID identity in the imported certificate" >&2; exit 1; }
          echo "APPLE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize macOS app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          APPLE_SIGN_IDENTITY="$APPLE_SIGN_IDENTITY" \
          APPLE_ID="${{ secrets.APPLE_ID }}" \
          APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
          APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
          make package-macos VERSION=${{ github.ref_name }}
          rm -rf dist/Relo.app

      - name: Upload macOS zips
        uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/
          retention-days: 30

  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    needs: [official, binaries]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package.json

      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          name: binaries
          path: dist

      - name: Build Linux packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.0
          make package-linux VERSION=${{ github.ref_name }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: linux
          # A glob list, not a brace: upload-artifact never expands a brace
          # pattern, so each format needs its own line.
          path: |
            dist/Relo-Setup-*.deb
            dist/Relo-Setup-*.rpm
          retention-days: 30

  windows:
    name: Build Windows installer
    runs-on: ubuntu-latest
    needs: [official, binaries]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package.json

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          name: binaries
          path: dist

      - name: Build Windows installer
        run: make package-windows VERSION=${{ github.ref_name }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/Relo-Setup-*.exe
          retention-days: 30

  release:
    needs: [binaries, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ls release/
          # An explicit asset list: the merged artifacts still carry the raw
          # build-all binaries the Linux and Windows packaging jobs consumed,
          # but the release itself carries only the versioned tarballs, the
          # checksums beside them, and the desktop installers.
          gh release create "$TAG_NAME" release/relo-*.tar.gz release/checksums.txt release/Relo-*.zip "release/Relo-Setup-"* \
            --title "$TAG_NAME" \
            --generate-notes \
            --draft
