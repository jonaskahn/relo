name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: Build daemon binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Check versions match tag
        run: ./scripts/version.py check ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build all platforms
        run: |
          make build-all VERSION=${{ github.ref_name }}
          cd dist && sha256sum relo-* > checksums.txt && cat checksums.txt

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: binaries
          path: dist/
          retention-days: 30

  macos:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Check versions match tag
        run: ./scripts/version.py check ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Import Developer ID certificate
        env:
          APPLE_SIGN_P12_BASE64: ${{ secrets.APPLE_SIGN_P12_BASE64 }}
          APPLE_SIGN_P12_PASSWORD: ${{ secrets.APPLE_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          printf '%s' "$APPLE_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k actions "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -n 1 | sed 's/.*) \([A-F0-9]*\) .*/\1/')
          [ -n "$identity" ] || { echo "no Developer ID identity in the imported certificate" >&2; exit 1; }
          echo "APPLE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize macOS app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          APPLE_SIGN_IDENTITY="$APPLE_SIGN_IDENTITY" \
          APPLE_ID="${{ secrets.APPLE_ID }}" \
          APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
          APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
          make package-macos VERSION=${{ github.ref_name }}
          rm -f dist/Relo.app

      - name: Upload macOS zips
        uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/
          retention-days: 30

  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          name: binaries
          path: dist

      - name: Build Linux packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          make package-linux VERSION=${{ github.ref_name }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/Relo-Setup-*.{deb,rpm}
          retention-days: 30

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: binaries
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          name: binaries
          path: dist

      - name: Build Windows installer
        shell: bash
        run: make package-windows VERSION=${{ github.ref_name }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/Relo-Setup-*.exe
          retention-days: 30

  release:
    needs: [binaries, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ls release/
          gh release create "$TAG_NAME" release/* \
            --title "$TAG_NAME" \
            --generate-notes \
            --draft
