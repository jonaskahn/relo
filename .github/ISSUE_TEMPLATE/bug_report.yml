name: Bug report
description: Report a problem with Relo.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short description of the problem.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the failure and what you were doing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that shows the problem.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relo version, OS, browser, console page, and locale.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Relevant error text, with secrets removed.
      render: text
  - type: textarea
    id: provider_exchange
    attributes:
      label: Provider exchange (masked)
      description: Paste the copied exchange or attach relo-request-*.json. Review it before sharing.
      render: json
  - type: markdown
    attributes:
      value: |
        Relo does not send the exchange. Review it, then paste it above or attach the downloaded relo-request-*.json file yourself.
